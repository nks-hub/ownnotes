name: nextcloudnotes
description: Independent Nextcloud Notes client.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.12.2 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  flutter_markdown: ^0.7.7
  markdown: ^7.3.1
  path_provider: ^2.1.6
  # App Group folder where the iOS share extension leaves shared content.
  path_provider_foundation: ^2.5.1
  # Crash reporting for our own builds only; without SENTRY_DSN
  # lib/core/telemetry.dart never initialises it.
  sentry_flutter: ^9.7.0
  # Anonymous screen usage for our own builds only, same gate as Sentry.
  rybbit_flutter_sdk: ^0.4.1
  notes_protocol:
    path: ../../packages/notes_protocol
  notes_store:
    path: ../../packages/notes_store
  intl: any
  archive: ^4.5.2
  file_picker: ^13.1.0
  shared_preferences: ^2.5.6
  local_auth: 3.0.2
  workmanager: ^0.10.10
  home_widget: ^0.10.0
  # Camera frames for the QR login scanner; zxing2 decodes the luminance plane
  # in pure Dart, so no ML Kit is pulled in.
  camera: ^0.12.1
  zxing2: ^0.2.4
  share_plus: ^13.3.1
  image_picker: ^1.2.4
  record: ^7.1.2
  audioplayers: ^6.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
flutter:
  uses-material-design: true
  assets:
    - assets/brand/play-store-icon.png
    - assets/fonts/OFL-NotoSansMono.txt
  fonts:
    # Variable subset (wght 400-700) for code and the monospace editor.
    - family: NotoSansMono
      fonts:
        - asset: assets/fonts/NotoSansMono-Subset.ttf
  generate: true
