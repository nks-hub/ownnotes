name: nextcloudnotes
description: Independent Nextcloud Notes client.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.12.2 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  flutter_markdown: ^0.7.7
  path_provider: ^2.1.6
  # Crash reporting for our own builds only; without SENTRY_DSN
  # lib/core/telemetry.dart never initialises it.
  sentry_flutter: ^9.7.0
  # Anonymous screen usage for our own builds only, same gate as Sentry.
  rybbit_flutter_sdk: ^0.4.1
  notes_protocol:
    path: ../../packages/notes_protocol
  notes_store:
    path: ../../packages/notes_store
  intl: any
  archive: ^4.5.2
  file_picker: ^13.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  generate: true
