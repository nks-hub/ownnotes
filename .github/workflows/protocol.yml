name: Notes protocol
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 tool/check_git_identity.py
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'
      - run: ./tool/check.sh
